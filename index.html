<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر الديون">
<link rel="manifest" href="manifest.json">
<title>دفتر الديون</title>
<style>
  :root{
    --primary:#0f766e; --primary-dark:#115e59; --primary-light:#ccfbf1;
    --danger:#dc2626; --success:#16a34a;
    --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --muted:#64748b;
    --border:#e2e8f0; --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  body{padding-bottom:env(safe-area-inset-bottom)}
  .app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
  .topbar{position:sticky;top:0;z-index:10;background:var(--primary);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .topbar h1{font-size:17px;margin:0;flex:1;font-weight:700}
  .topbar button{background:rgba(255,255,255,.15);border:0;color:#fff;padding:8px 10px;border-radius:10px;font-size:14px;cursor:pointer}
  .content{padding:14px}
  .card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:12px;border:1px solid var(--border)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--primary);color:#fff;border:0;padding:11px 16px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;width:100%}
  .btn.secondary{background:var(--primary-light);color:var(--primary-dark)}
  .btn.danger{background:var(--danger)}
  .btn.success{background:var(--success)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
  .btn-sm{padding:7px 12px;font-size:13px;width:auto}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--muted)}
  .field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--text)}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .customer-item{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--border);cursor:pointer}
  .customer-item:last-child{border-bottom:0}
  .avatar{width:44px;height:44px;border-radius:50%;background:var(--primary-light);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex-shrink:0}
  .cust-info{flex:1;min-width:0}
  .cust-name{font-weight:600;font-size:15px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cust-phone{font-size:12px;color:var(--muted)}
  .cust-balance{text-align:left;font-weight:700;font-size:15px;color:var(--danger);white-space:nowrap}
  .cust-balance.zero{color:var(--muted)}
  .cust-balance.credit{color:var(--success)}
  .empty{text-align:center;padding:50px 20px;color:var(--muted)}
  .fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);min-width:180px;padding:14px 22px;border-radius:30px;font-size:16px;box-shadow:0 6px 20px rgba(15,118,110,.4);z-index:20;width:auto}
  .balance-card{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:20px;border-radius:var(--radius);margin-bottom:14px}
  .balance-card .label{font-size:13px;opacity:.85;margin-bottom:5px}
  .balance-card .amount{font-size:30px;font-weight:800;margin-bottom:8px}
  .balance-card .sub{font-size:12px;opacity:.9}
  .breakdown-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .breakdown-cell{background:rgba(255,255,255,.15);padding:10px;border-radius:10px}
  .breakdown-cell .l{font-size:11px;opacity:.85;margin-bottom:3px}
  .breakdown-cell .v{font-size:14px;font-weight:700}
  .txn-item{display:flex;justify-content:space-between;align-items:flex-start;padding:12px;border-bottom:1px solid var(--border);gap:10px}
  .txn-item:last-child{border-bottom:0}
  .txn-left{flex:1;min-width:0}
  .txn-cat{font-weight:600;font-size:14px;margin-bottom:3px}
  .txn-meta{font-size:12px;color:var(--muted)}
  .txn-amount{font-weight:700;font-size:15px;white-space:nowrap}
  .txn-amount.debt{color:var(--danger)}
  .txn-amount.payment{color:var(--success)}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
  .modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .modal-header h2{margin:0;font-size:18px}
  .close-btn{background:#f1f5f9;border:0;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--muted)}
  .segmented{display:flex;background:#f1f5f9;border-radius:10px;padding:4px;margin-bottom:14px}
  .segmented button{flex:1;background:transparent;border:0;padding:9px;font-size:14px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--muted);font-family:inherit}
  .segmented button.active{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .segmented button.active.debt{color:var(--danger)}
  .segmented button.active.payment{color:var(--success)}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:24px;font-size:14px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .row-actions{display:flex;gap:8px;margin-bottom:12px}
  .row-actions .btn{flex:1}
  .section-title{font-size:14px;font-weight:700;color:var(--muted);margin:16px 0 8px;padding:0 4px}
  .chip{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600;margin-top:3px}
  .chip.bag{background:#fef3c7;color:#92400e}
  .chip.credit{background:#dbeafe;color:#1e40af}
  .chip.transfer{background:#fce7f3;color:#9f1239}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const DB_KEY = 'daftar_diyoun_v1';
const defaultData = () => ({
  shop: {
    name: 'محلي', phone: '', pin: null,
    baseCurrency: 'USD',
    currencies: ['USD', 'LBP'],
    rates: { USD: 1, LBP: 89500 },
    categories: [
      { id: 'c1', name: 'بضاعة', color: 'bag', commission: { type: 'none', value: 0 } },
      { id: 'c2', name: 'رصيد جوال', color: 'credit', commission: { type: 'none', value: 0 } },
      { id: 'c3', name: 'حوالات', color: 'transfer', commission: { type: 'fixed', value: 1 } }
    ],
    waTemplate: 'مرحباً {name} 👋\nكشف حسابك لدى {shop}:\nالرصيد المتبقي: {balance}\nشكراً لتعاملكم معنا.'
  },
  customers: [],
  transactions: []
});
let data = loadData();
let currentCustomerId = null;

function loadData(){
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) return defaultData();
    const parsed = JSON.parse(raw);
    const d = defaultData();
    return { ...d, ...parsed, shop: { ...d.shop, ...(parsed.shop||{}) } };
  } catch(e){ return defaultData(); }
}
function saveData(){ localStorage.setItem(DB_KEY, JSON.stringify(data)); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const fmt = (n) => {
  if (n == null || isNaN(n)) return '0';
  const rounded = Math.round(n * 100) / 100;
  return rounded.toLocaleString('en-US', { maximumFractionDigits: 2 });
};
const today = () => new Date().toISOString().slice(0,10);
const catById = (id) => data.shop.categories.find(c => c.id === id) || { name: 'أخرى', color: 'bag' };

function calcCustomerBalance(customerId){
  const txns = data.transactions.filter(t => t.customerId === customerId);
  const byCurrency = {};
  const byCategory = {};
  txns.forEach(t => {
    const sign = t.type === 'debt' ? 1 : -1;
    byCurrency[t.currency] = (byCurrency[t.currency] || 0) + sign * t.amount;
    if (t.type === 'debt') {
      const key = t.categoryId;
      if (!byCategory[key]) byCategory[key] = {};
      byCategory[key][t.currency] = (byCategory[key][t.currency] || 0) + t.amount;
    }
  });
  let totalBase = 0;
  txns.forEach(t => {
    const baseValue = t.amount / (t.rate || 1);
    totalBase += (t.type === 'debt' ? 1 : -1) * baseValue;
  });
  return { byCurrency, byCategory, totalBase, txns };
}
function customerTotalBase(customerId){ return calcCustomerBalance(customerId).totalBase; }

function render(){
  const hash = location.hash.replace('#','') || 'home';
  if (hash.startsWith('customer/')) {
    const id = hash.split('/')[1];
    currentCustomerId = id;
    renderCustomer(id);
  } else if (hash === 'settings') {
    renderSettings();
  } else {
    renderHome();
  }
}

function renderHome(){
  const totalAll = data.customers.reduce((s,c) => s + customerTotalBase(c.id), 0);
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topbar">
      <h1>📒 دفتر الديون</h1>
      <button onclick="location.hash='settings'">⚙️</button>
    </div>
    <div class="content">
      <div class="balance-card">
        <div class="label">إجمالي الديون على الزبائن</div>
        <div class="amount">${fmt(totalAll)} ${data.shop.baseCurrency}</div>
        <div class="sub">${data.customers.length} زبون</div>
      </div>
      <div class="section-title">الزبائن</div>
      <div class="card" style="padding:0;overflow:hidden">
        ${data.customers.length === 0 ? `
          <div class="empty">
            <div style="font-size:50px">📋</div>
            <div style="font-weight:600;margin-bottom:6px">لا يوجد زبائن بعد</div>
            <div style="font-size:13px">أضف أول زبون لتبدأ تسجيل الديون</div>
          </div>
        ` : data.customers.map(c => {
          const bal = customerTotalBase(c.id);
          const balClass = bal > 0.01 ? 'debt' : (bal < -0.01 ? 'credit' : 'zero');
          const initials = (c.name || '؟').trim().charAt(0);
          return `
            <div class="customer-item" onclick="location.hash='customer/${c.id}'">
              <div class="avatar">${initials}</div>
              <div class="cust-info">
                <div class="cust-name">${escapeHtml(c.name)}</div>
                <div class="cust-phone">${escapeHtml(c.phone || 'بدون رقم')}</div>
              </div>
              <div class="cust-balance ${balClass}">${fmt(bal)} ${data.shop.baseCurrency}</div>
            </div>
          `;
        }).join('')}
      </div>
      <div style="height:80px"></div>
    </div>
    <button class="btn fab" onclick="openAddCustomer()">➕ إضافة زبون</button>
  `;
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderCustomer(id){
  const c = data.customers.find(x => x.id === id);
  if (!c) { location.hash=''; return; }
  const { byCurrency, byCategory, totalBase, txns } = calcCustomerBalance(id);
  const sorted = [...txns].sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
  const currencyList = Object.entries(byCurrency).filter(([,v]) => Math.abs(v) > 0.001);
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topbar">
      <button onclick="location.hash=''">←</button>
      <h1>${escapeHtml(c.name)}</h1>
      <button onclick="openEditCustomer('${id}')">✏️</button>
    </div>
    <div class="content">
      <div class="balance-card">
        <div class="label">الرصيد المتبقي</div>
        <div class="amount">${fmt(totalBase)} ${data.shop.baseCurrency}</div>
        ${currencyList.length > 0 ? `<div class="sub">${currencyList.map(([cur,v]) => `${fmt(v)} ${cur}`).join(' • ')}</div>` : ''}
        ${Object.keys(byCategory).length > 0 ? `
          <div class="breakdown-grid">
            ${Object.entries(byCategory).map(([cid, curObj]) => {
              const cat = catById(cid);
              const txt = Object.entries(curObj).map(([cur,v]) => `${fmt(v)} ${cur}`).join(' / ');
              return `<div class="breakdown-cell"><div class="l">${escapeHtml(cat.name)}</div><div class="v">${txt}</div></div>`;
            }).join('')}
          </div>
        ` : ''}
      </div>
      <div class="row-actions">
        <button class="btn success btn-sm" onclick="sendWhatsApp('${id}')">📤 واتساب</button>
        <button class="btn secondary btn-sm" onclick="window.print()">📄 PDF</button>
      </div>
      <div class="section-title">الحركات (${sorted.length})</div>
      <div class="card" style="padding:0;overflow:hidden">
        ${sorted.length === 0 ? `
          <div class="empty"><div style="font-size:40px">💸</div><div>لا توجد حركات</div></div>
        ` : sorted.map(t => {
          const cat = catById(t.categoryId);
          const chipClass = cat.color || 'bag';
          return `
            <div class="txn-item">
              <div class="txn-left">
                <div class="txn-cat">${escapeHtml(cat.name)} <span class="chip ${chipClass}">${t.type === 'debt' ? 'دين' : 'دفعة'}</span></div>
                <div class="txn-meta">${t.date}${t.note ? ' — ' + escapeHtml(t.note) : ''}</div>
              </div>
              <div class="txn-amount ${t.type}">${t.type==='debt'?'+':'−'}${fmt(t.amount)} ${t.currency}</div>
            </div>
          `;
        }).join('')}
      </div>
      <div style="height:90px"></div>
    </div>
    <button class="btn fab" onclick="openAddTransaction('${id}')">➕ إضافة حركة</button>
  `;
}

function openAddCustomer(){
  showModal(`
    <div class="modal-header"><h2>زبون جديد</h2><button class="close-btn" onclick="closeModal()">×</button></div>
    <div class="field"><label>الاسم *</label><input id="new-name" placeholder="مثال: محمد علي"></div>
    <div class="field"><label>رقم الواتساب (بالصيغة الدولية)</label><input id="new-phone" type="tel" placeholder="مثال: 96170123456" dir="ltr" style="text-align:left"></div>
    <div class="field"><label>ملاحظة (اختياري)</label><input id="new-note" placeholder="مثال: جار المحل"></div>
    <button class="btn" onclick="saveCustomer()">حفظ</button>
  `);
}

function openEditCustomer(id){
  const c = data.customers.find(x => x.id === id);
  if (!c) return;
  showModal(`
    <div class="modal-header"><h2>تعديل الزبون</h2><button class="close-btn" onclick="closeModal()">×</button></div>
    <div class="field"><label>الاسم *</label><input id="new-name" value="${escapeHtml(c.name)}"></div>
    <div class="field"><label>رقم الواتساب</label><input id="new-phone" type="tel" value="${escapeHtml(c.phone||'')}" dir="ltr" style="text-align:left"></div>
    <div class="field"><label>ملاحظة</label><input id="new-note" value="${escapeHtml(c.note||'')}"></div>
    <button class="btn" onclick="updateCustomer('${id}')">تحديث</button>
  `);
}

function saveCustomer(){
  const name = document.getElementById('new-name').value.trim();
  const phone = document.getElementById('new-phone').value.trim();
  const note = document.getElementById('new-note').value.trim();
  if (!name) { toast('أدخل الاسم'); return; }
  const c = { id: uid(), name, phone, note, createdAt: Date.now() };
  data.customers.push(c);
  saveData(); closeModal(); toast('تم حفظ الزبون');
  location.hash = 'customer/' + c.id;
}

function updateCustomer(id){
  const c = data.customers.find(x => x.id === id);
  if (!c) return;
  c.name = document.getElementById('new-name').value.trim();
  c.phone = document.getElementById('new-phone').value.trim();
  c.note = document.getElementById('new-note').value.trim();
  if (!c.name) { toast('أدخل الاسم'); return; }
  saveData(); closeModal(); toast('تم التحديث'); render();
}

function openAddTransaction(customerId){
  const cur = data.shop.baseCurrency;
  showModal(`
    <div class="modal-header"><h2>حركة جديدة</h2><button class="close-btn" onclick="closeModal()">×</button></div>
    <div class="segmented" id="txn-type-seg">
      <button class="active debt" data-type="debt" onclick="setTxnType('debt')">🔴 دين (عليه)</button>
      <button data-type="payment" onclick="setTxnType('payment')">🟢 دفعة (سدّد)</button>
    </div>
    <div class="field"><label>المبلغ *</label><input id="txn-amount" type="number" inputmode="decimal" step="0.01" placeholder="0"></div>
    <div class="row">
      <div class="field"><label>العملة</label>
        <select id="txn-currency" onchange="updateRateHint()">
          ${data.shop.currencies.map(c => `<option value="${c}" ${c===cur?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>الفئة</label>
        <select id="txn-category">
          ${data.shop.categories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="field" id="rate-hint" style="font-size:12px;color:var(--muted);margin-top:-6px"></div>
    <div class="field"><label>التاريخ</label><input id="txn-date" type="date" value="${today()}"></div>
    <div class="field"><label>ملاحظة (اختياري)</label><input id="txn-note" placeholder="مثال: 3 كيلو سكر"></div>
    <button class="btn" onclick="saveTransaction('${customerId}')">حفظ الحركة</button>
  `, () => { window._txnType = 'debt'; updateRateHint(); });
}

function setTxnType(type){
  window._txnType = type;
  document.querySelectorAll('#txn-type-seg button').forEach(b => {
    b.classList.toggle('active', b.dataset.type === type);
    if (b.dataset.type === type) b.classList.add(type);
    else b.classList.remove('debt','payment');
  });
}
function updateRateHint(){
  const cur = document.getElementById('txn-currency').value;
  const hint = document.getElementById('rate-hint');
  if (!hint) return;
  if (cur === data.shop.baseCurrency) hint.textContent = 'العملة الأساسية';
  else {
    const rate = data.shop.rates[cur] || 1;
    hint.textContent = `سعر الصرف المحفوظ: 1 ${data.shop.baseCurrency} = ${fmt(rate)} ${cur}`;
  }
}
function saveTransaction(customerId){
  const type = window._txnType || 'debt';
  const amount = parseFloat(document.getElementById('txn-amount').value);
  const currency = document.getElementById('txn-currency').value;
  const categoryId = document.getElementById('txn-category').value;
  const date = document.getElementById('txn-date').value;
  const note = document.getElementById('txn-note').value.trim();
  if (!amount || amount <= 0) { toast('أدخل مبلغاً صحيحاً'); return; }
  const rate = data.shop.rates[currency] || 1;
  data.transactions.push({ id: uid(), customerId, type, amount, currency, rate, categoryId, date, note, createdAt: Date.now() });
  saveData(); closeModal(); toast('تم حفظ الحركة'); render();
}

function sendWhatsApp(customerId){
  const c = data.customers.find(x => x.id === customerId);
  if (!c) return;
  if (!c.phone || c.phone.length < 8) {
    if (confirm('لا يوجد رقم واتساب لهذا الزبون. هل تريد إضافته الآن؟')) openEditCustomer(customerId);
    return;
  }
  const { totalBase, byCurrency } = calcCustomerBalance(customerId);
  const balText = [`${fmt(totalBase)} ${data.shop.baseCurrency}`,
    ...Object.entries(byCurrency).filter(([,v]) => Math.abs(v) > 0.001).map(([cur,v]) => `${fmt(v)} ${cur}`)
  ].join(' / ');
  let msg = data.shop.waTemplate.replace(/{name}/g, c.name).replace(/{shop}/g, data.shop.name).replace(/{balance}/g, balText);
  const phone = c.phone.replace(/\D/g, '');
  const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
  if (confirm(`إرسال إلى: ${c.name}\nالرقم: ${c.phone}\n\n${msg}`)) window.open(url, '_blank');
}

function renderSettings(){
  const s = data.shop;
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topbar"><button onclick="location.hash=''">←</button><h1>الإعدادات</h1><span style="width:40px"></span></div>
    <div class="content">
      <div class="card">
        <div class="field"><label>اسم المحل</label><input id="s-name" value="${escapeHtml(s.name)}"></div>
        <div class="field"><label>رقم واتساب المحل</label><input id="s-phone" value="${escapeHtml(s.phone)}" dir="ltr" style="text-align:left"></div>
        <div class="field"><label>العملة الأساسية</label><input id="s-base" value="${escapeHtml(s.baseCurrency)}" dir="ltr" style="text-align:left"></div>
        <button class="btn btn-sm" onclick="saveShopSettings()">حفظ</button>
      </div>
      <div class="section-title">أسعار الصرف (لكل 1 ${escapeHtml(s.baseCurrency)})</div>
      <div class="card">
        ${s.currencies.filter(c => c !== s.baseCurrency).map(c => `
          <div class="field"><label>1 ${escapeHtml(s.baseCurrency)} = ? ${escapeHtml(c)}</label>
          <input type="number" step="1" data-rate="${c}" value="${s.rates[c]||1}"></div>
        `).join('') || '<div style="color:var(--muted);font-size:13px">لا توجد عملات إضافية</div>'}
        <button class="btn btn-sm" onclick="saveRates()">حفظ الأسعار</button>
      </div>
      <div class="section-title">الفئات</div>
      <div class="card">
        ${s.categories.map(cat => `<div style="padding:8px 0;border-bottom:1px solid var(--border)">${escapeHtml(cat.name)}</div>`).join('')}
      </div>
      <div class="section-title">النسخ الاحتياطي</div>
      <div class="card">
        <button class="btn secondary btn-sm" style="width:100%;margin-bottom:8px" onclick="backup()">💾 تصدير نسخة احتياطية</button>
        <button class="btn ghost btn-sm" style="width:100%" onclick="document.getElementById('restore-file').click()">📂 استيراد نسخة</button>
        <input type="file" id="restore-file" accept=".json" style="display:none" onchange="restore(event)">
      </div>
      <div class="section-title">خطير</div>
      <div class="card">
        <button class="btn danger btn-sm" style="width:100%" onclick="resetAll()">🗑️ حذف كل البيانات</button>
      </div>
    </div>
  `;
}
function saveShopSettings(){
  data.shop.name = document.getElementById('s-name').value.trim() || 'محلي';
  data.shop.phone = document.getElementById('s-phone').value.trim();
  const newBase = document.getElementById('s-base').value.trim().toUpperCase();
  if (newBase && !data.shop.currencies.includes(newBase)) {
    data.shop.currencies.push(newBase); data.shop.rates[newBase] = 1;
  }
  data.shop.baseCurrency = newBase || data.shop.baseCurrency;
  saveData(); toast('تم الحفظ'); renderSettings();
}
function saveRates(){
  document.querySelectorAll('[data-rate]').forEach(inp => { data.shop.rates[inp.dataset.rate] = parseFloat(inp.value) || 1; });
  saveData(); toast('تم حفظ الأسعار');
}
function backup(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `daftar-backup-${today()}.json`; a.click();
  URL.revokeObjectURL(url); toast('تم تصدير النسخة');
}
function restore(ev){
  const file = ev.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.customers || !parsed.transactions) throw new Error('ملف غير صالح');
      if (!confirm('سيتم استبدال كل البيانات الحالية. متابعة؟')) return;
      data = parsed; saveData(); toast('تم الاستيراد'); location.hash=''; render();
    } catch(err){ toast('ملف غير صالح'); }
  };
  reader.readAsText(file);
}
function resetAll(){
  if (!confirm('هل أنت متأكد؟ سيتم حذف كل الزبائن والحركات نهائياً.')) return;
  if (!confirm('تأكيد أخير: حذف كل البيانات؟')) return;
  data = defaultData(); saveData(); location.hash=''; render(); toast('تم الحذف');
}

function showModal(html, cb){
  const bg = document.createElement('div');
  bg.className = 'modal-bg'; bg.id = 'modal-bg';
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.addEventListener('click', (e) => { if (e.target === bg) closeModal(); });
  document.body.appendChild(bg);
  if (cb) setTimeout(cb, 0);
}
function closeModal(){ const m = document.getElementById('modal-bg'); if (m) m.remove(); }

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', () => {
  render();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(()=>{});
});
</script>
</body>
</html>
